<head>

  <meta charset="UTF-8" />

  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon/favicon.svg" />

  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/favicon/apple-touch-icon.png" />

<body class="fram-body-bg-color">
  <div id="introScreen" class="intro-screen">
    <div class="intro-content">
      <h1 class="intro-title">SANJAY CHOUHAN</h1>

      <div class="intro-center">
        <!-- Infinity Circle Preloader (3 Concentric Pair Ripple) -->
        <div id="introRingAnim" class="intro-ring-anim">
          <svg class="infinity-preloader-svg" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg">
            <g class="infinity-preloader-group">
              <!--
                Delays are NEGATIVE so every ring is already mid-phase on frame 1
                (a positive delay would hold the ring frozen at its 0% keyframe).
                Pairs are spaced T/3 apart (0.8s of the 2.4s cycle) so the wave
                travels left -> right and the loader is never close to empty.
                Inner ring trails its outer by T/12 (0.2s) so the pair reads as one object.
              -->
              <!-- Circle 1 (Left: cx = 127, cy = 130) -->
              <!-- Phase 1 Target: Circle 1 Top Arc (Point A to Point B) -->
              <path class="arc-path arc-c1-top arc-outer" d="M 9 130 A 118 118 0 0 1 245 130"></path>
              <path class="arc-path arc-c1-top arc-inner" d="M 32 130 A 95 95 0 0 1 222 130"></path>
              <path class="arc-path arc-c1-bottom arc-outer" d="M 9 130 A 118 118 0 0 0 245 130"></path>
              <path class="arc-path arc-c1-bottom arc-inner" d="M 32 130 A 95 95 0 0 0 222 130"></path>

              <!-- Circle 2 (Center: cx = 340, cy = 130) -->
              <!-- Phase 2 Target: Circle 2 Bottom Arc (Point B to Point C) -->
              <path class="arc-path arc-c2-top arc-outer" d="M 222 130 A 118 118 0 0 1 458 130"></path>
              <path class="arc-path arc-c2-top arc-inner" d="M 245 130 A 95 95 0 0 1 435 130"></path>
              <path class="arc-path arc-c2-bottom arc-outer" d="M 222 130 A 118 118 0 0 0 458 130"></path>
              <path class="arc-path arc-c2-bottom arc-inner" d="M 245 130 A 95 95 0 0 0 435 130"></path>

              <!-- Circle 3 (Right: cx = 553, cy = 130) -->
              <path class="arc-path arc-c3-top arc-outer" d="M 435 130 A 118 118 0 0 1 671 130"></path>
              <path class="arc-path arc-c3-top arc-inner" d="M 458 130 A 95 95 0 0 1 648 130"></path>
              <path class="arc-path arc-c3-bottom arc-outer" d="M 435 130 A 118 118 0 0 0 671 130"></path>
              <path class="arc-path arc-c3-bottom arc-inner" d="M 458 130 A 95 95 0 0 0 648 130"></path>
            </g>
          </svg>
        </div>

        <!-- Circular Enter Button -->
        <button id="enterBtn" class="intro-enter-btn">
          <span class="enter-text">Enter</span>
        </button>
      </div>

      <p class="intro-subtitle">BACKEND DEVELOPER &amp; FULL-STACK ENGINEER</p>
    </div>
  </div>
  <div id="nav-progress-bar"></div>
  <div id="cursor-outline"></div>
  <div id="cursor-dot"></div>
  <div class="container" id="lodingConatiner">
    <div class="first">
      <h1 class="head" id="counter">000</h1>
    </div>

    <div class="second">
      <div class="loaddiv">
        <div class="loader" id="loader"></div>
        <div class="loader2"></div>
      </div>

    </div>

  </div>
   <div class="mp-wrap">
    <div class="mp-card" id="mp-card" title="Click to Play / Pause Sound">
      <audio id="bg-audio" src="/assets/audio/sound.mp3" loop preload="auto"></audio>

      <!-- Album art / image -->
      <div class="mp-img" id="mp-img">
        <div class="mp-img-inner">
          <img src="/assets/sanjay.jpg" alt="Sanjay Chouhan" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">
        </div>
        <div class="mp-control-overlay" id="mp-control-overlay">
          <span class="mp-icon" id="mp-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="white">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
          </span>
        </div>
      </div>

      <div class="mp-info">

        <!-- Music name scrolling text -->
        <div class="mp-title-wrap">
          <span class="mp-title" id="mp-title">Sanjay Chouhan — Background Sound</span>
        </div>

        <!-- Progress bar -->
        <div class="mp-progress-row">
          <div class="mp-dot" id="mp-dot"></div>
          <div class="mp-progress-bg">
            <div class="mp-progress-fill" id="mp-progress-fill"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

</body>

</html>
